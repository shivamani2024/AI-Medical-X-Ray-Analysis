<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Welcome | Chest X-Ray Analysis</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .welcome-card h1 {
            max-width: 18ch;
            line-height: 1.25;
        }

        .welcome-copy {
            margin: 12px 0 0;
            color: #53665f;
            font-size: 14px;
            line-height: 1.65;
        }

        .welcome-progress {
            height: 4px;
            margin: 24px 0 16px;
            overflow: hidden;
            border-radius: 2px;
            background: #e2eae6;
        }

        .welcome-progress span {
            display: block;
            width: 100%;
            height: 100%;
            transform: scaleX(0);
            transform-origin: left;
            background: #16756f;
            animation: welcome-progress 2.6s linear forwards;
        }

        .welcome-link {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            text-decoration: none;
        }

        @keyframes welcome-progress {
            to {
                transform: scaleX(1);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .welcome-progress span {
                animation-duration: 0.01ms;
            }
        }
    </style>
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card welcome-card" aria-live="polite">
            <div class="login-icon" aria-hidden="true">🩻</div>
            <p class="auth-subtitle">Secure patient portal</p>
            <h1>Welcome to Chest X-Ray Analysis<span id="welcomeName"></span></h1>
            <p class="welcome-copy">Your account is ready. Your scans, reports, and analysis history are available only after you sign in.</p>
            <div class="welcome-progress" aria-hidden="true"><span></span></div>
            <p class="welcome-copy">Opening your dashboard...</p>
            <a class="btn btn-primary full-width welcome-link" href="dashboard.html">Continue to dashboard</a>
        </section>
    </main>

    <script>
        const accessToken = localStorage.getItem("access_token");

        if (!accessToken) {
            window.location.replace("login.html");
        } else {
            let activeUser = null;

            try {
                activeUser = JSON.parse(
                    localStorage.getItem("current_user") || "null"
                );
            } catch (error) {
                activeUser = null;
            }

            if (activeUser && typeof activeUser.name === "string") {
                document.getElementById("welcomeName").textContent =
                    `, ${activeUser.name.trim()}`;
            }

            window.setTimeout(function() {
                window.location.replace("dashboard.html");
            }, 2600);
        }
    </script>
</body>

</html>
