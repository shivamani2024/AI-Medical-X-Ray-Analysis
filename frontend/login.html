<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="login-icon">
                🩺
            </div>

            <h1>
                Patient Login
            </h1>

            <p class="auth-subtitle">
                Access your medical dashboard
            </p>


            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    required
                >

                <label class="remember-session">
                    <input
                        type="checkbox"
                        id="rememberMe"
                        checked
                    >
                    Keep me signed in on this device
                </label>


                <button
                    type="submit"
                    class="btn btn-primary full-width"
                >
                    Login
                </button>

            </form>


            <div
                id="loginMessage"
                class="message"
            ></div>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
