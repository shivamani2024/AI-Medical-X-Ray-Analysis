<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Registration</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <h1>
                Patient Registration
            </h1>

            <p class="auth-subtitle">
                Create your secure patient account
            </p>


            <form id="registerForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="8"
                    required
                >


                <label>
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="1"
                    max="120"
                    required
                >


                <label>
                    Gender
                </label>

                <select
                    id="gender"
                    required
                >

                    <option value="">
                        Select Gender
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>


                <label>
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    required
                >


                <button
                    type="submit"
                    class="btn btn-primary full-width"
                >
                    Create Account
                </button>

            </form>


            <div
                id="registerMessage"
                class="message"
            ></div>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
